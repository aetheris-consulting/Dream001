[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dream001"
version = "0.2.0"
description = "Logit Entropy Regime Model - ISCOT reference implementation"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Thomas Theodore Giza", email = "thomas@aetheris.consulting"}]
dependencies = ["numpy>=1.24", "datasets>=2.18"]

[project.optional-dependencies]
hf = ["torch>=2.1", "transformers>=4.40"]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["dream001*"]
